[project]
name = "discord-bot"
version = "1.0.0"
description = "The Headhunter's Guild Discord Bot"
readme = "README.md"
requires-python = ">=3.11.5, <3.16"
dependencies = [
    "aiohttp>=3.11.18",
    "asyncpg>=0.30.0",
    "discord-py>=2.5.2",
    "fake-useragent>=2.2.0",
    "gallery-dl>=1.27.0",
    "langdetect>=1.0.9",
    "pymultidictionary>=1.3.2",
    "python-dateutil>=2.9.0.post0",
    "requests>=2.23.0",
    "yt-dlp>=2025.4.30",
]

[dependency-groups]
lint = [
    "ruff>=0.17.4",
]
dev = [
    "pytest>=9.2.0",
    {include-group = "lint"}
]
[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
    "E",      # pycodestyle
    "F",      # Pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    ]
ignore = [
    "UP015",  # redundant-open-modes - https://docs.astral.sh/ruff/rules/redundant-open-modes/
    "E501",   # line-too-long - https://docs.astral.sh/ruff/rules/line-too-long/
    ]
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[\\p{XID_Continue}]*[\\p{XID_Continue}--_]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
# Respect magic trailing commas.
skip-magic-trailing-comma = false
# Automatically detect the appropriate line ending (CRLF or LF) based on the system.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = true

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"