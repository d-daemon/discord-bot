services:
  discord-bot:
    image: hhxcusco/discord-bot:latest
    container_name: discord_bot
    user: ${PUID:-1000}:${PGID:-1000}
    ports:
      - "${DISCORD_BOT_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      INSTAGRAM_COOKIES:
      DEEPL_API_KEY: ${DEEPL_API_KEY:-}
      MYMEMORY_API_KEY: ${MYMEMORY_API_KEY:-}
    volumes:
      - ${PROJECT_DIRECTORY:-.}/config:/app/config
      - ${PROJECT_DIRECTORY:-.}/data:/app/data
    restart: unless-stopped
    networks:
      - discord-bot-network

  postgres:
    image: postgres:18.6
    container_name: discord_bot_postgres
    user: ${PUID:-1000}:${PGID:-1000}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ${PROJECT_DIRECTORY:-.}/db:/var/lib/postgresql
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - discord-bot-network

networks:
  discord-bot-network:
    driver: bridge
